<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#lg1)" rx="12"/>
  
  <text x="40" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1e293b">System Architecture</text>
  
  <!-- Client -->
  <rect x="40" y="80" width="200" height="120" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
  <text x="60" y="105" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Next.js 16</text>
  <text x="60" y="125" font-family="Inter, sans-serif" font-size="12" fill="#64748b">App Router + TypeScript</text>
  <text x="60" y="150" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Tailwind CSS v4</text>
  
  <!-- Auth -->
  <rect x="280" y="80" width="200" height="120" fill="#dbeafe" rx="8"/>
  <text x="300" y="105" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1e40af">Clerk Auth</text>
  <text x="300" y="125" font-family="Inter, sans-serif" font-size="12" fill="#64748b">JWT + RBAC Claims</text>
  <text x="300" y="150" font-family="Inter, sans-serif" font-size="12" fill="#64748b">platformRole, tenant_id</text>
  
  <!-- Proxy/RBAC -->
  <rect x="520" y="80" width="200" height="120" fill="#ffe6e6" rx="8"/>
  <text x="540" y="105" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#b91c1c">Route RBAC Proxy</text>
  <text x="540" y="125" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Defense-in-depth</text>
  
  <!-- API -->
  <rect x="300" y="240" width="180" height="120" fill="#d1fae5" rx="8"/>
  <text x="320" y="265" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#15803d">Backend API</text>
  <text x="320" y="285" font-family="Inter, sans-serif" font-size="12" fill="#64748b">REST + OpenAPI</text>
  <text x="320" y="310" font-family="Inter, sans-serif" font-size="12" fill="#64748b">/api/v1</text>
  
  <!-- M-Pesa -->
  <rect x="520" y="240" width="200" height="120" fill="#fef3c7" rx="8"/>
  <text x="540" y="265" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#92400e">M-Pesa STK Push</text>
  <text x="540" y="285" font-family="Inter, sans-serif" font-size="12" fill="#64748b">KES Payments</text>
  
  <!-- Arrows -->
  <path d="M140 140 L260 140" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M250 145 L260 140 L250 135" fill="#94a3b8"/>
  
  <path d="M380 140 L500 140" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M490 145 L500 140 L490 135" fill="#94a3b8"/>
  
  <path d="M300 200 L380 240" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M375 245 L380 240 L385 235" fill="#94a3b8"/>
  
  <path d="M300 200 L510 240" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M505 245 L510 240 L515 235" fill="#94a3b8"/>
</svg>