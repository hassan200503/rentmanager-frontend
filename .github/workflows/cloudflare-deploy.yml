# Build the app with OpenNext and deploy it to Cloudflare Workers.
#
# Cloudflare is the free home for this site, chosen after the two previous
# hosts failed for opposite reasons:
#
#   - Netlify meters deploys in credits (300/month, 15 per production deploy).
#     17 deploys in one cycle used 255 of them and the site was suspended.
#     Traffic was never the problem: 9,051 web requests cost 1.8 credits.
#   - Deno Deploy gives an *unverified* organisation 1% of its free plan --
#     10k requests and 0.2 CPU-hours a month -- and lifting that needs a
#     payment method. Builds, not visitors, consumed 90% of the month's CPU
#     in a single day.
#
# Cloudflare's free plan has no credit system and needs no card. Requests to
# static assets are free, unlimited, and do not invoke the Worker at all, so
# the prerendered pages -- the landing page, the policy pages, the listings
# shell -- cost nothing. Only genuinely dynamic routes run Worker code.
#
# The limit to watch is CPU, not size: 10 ms per Worker invocation on the free
# plan. Exceeding it fails that request rather than suspending the account, so
# it is safe to find out by deploying. The size ceiling that once ruled
# Cloudflare out -- 3 MiB compressed -- no longer exists; it is 64 MiB
# uncompressed now, and this app measures about 21.9 MiB.
#
# Secrets this needs, in repo Settings -> Secrets and variables -> Actions:
#
#   CLOUDFLARE_API_TOKEN   from Cloudflare: My Profile -> API Tokens ->
#                          "Edit Cloudflare Workers" template. Genuinely secret.
#   CLOUDFLARE_ACCOUNT_ID  the hex string in the dashboard URL. Not sensitive,
#                          but kept here so the workflow needs no edit.
#   CLERK_SECRET_KEY       genuinely secret.
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#                          NOT secret -- it ships in the browser bundle by
#                          design -- but it is read here rather than hardcoded
#                          so the same workflow serves the development and
#                          production Clerk instances without an edit. Note
#                          next.config.ts decodes it to derive the Clerk origin
#                          for the CSP, so a wrong-shaped value breaks sign-in
#                          rather than failing the build.
#
# The two URL variables below are deliberately literal. They are inlined into
# the client bundle at build time, so they have to be right *before* the build,
# and getting them wrong is silent: the browser simply calls a host that is not
# there. Change them here when the site moves.

name: Deploy to Cloudflare Workers

on:
    workflow_dispatch:
    push:
        branches: ["main"]
        paths-ignore:
            - "docs/**"
            - "**/*.md"

concurrency:
    group: cloudflare-deploy
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - run: npm ci

            # Fail here rather than three minutes later inside wrangler, and
            # name the missing secret instead of printing a generic auth error.
            - name: Check the required secrets are set
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
                  CLERK_PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLERK_SECRET_KEY CLERK_PK; do
                      eval "value=\${$name:-}"
                      [ -n "$value" ] || missing="$missing $name"
                  done
                  if [ -n "$missing" ]; then
                      echo "::error::Missing repository secret(s):$missing"
                      exit 1
                  fi
                  echo "All required secrets are present."

            - name: Build the Worker with OpenNext
              env:
                  # next.config.ts refuses a production build without this
                  # rather than silently proxying /api/v1 to localhost.
                  BACKEND_URL: https://rentmanager-api-2reb.onrender.com
                  # Points at the site's OWN /api/v1, which next.config.ts
                  # rewrites to BACKEND_URL. That keeps the browser
                  # same-origin and lets the CSP stay at connect-src 'self'.
                  NEXT_PUBLIC_API_URL: https://www.rentmanagerke.workers.dev/api/v1
                  NEXT_PUBLIC_APP_URL: https://www.rentmanagerke.workers.dev
                  NEXT_PUBLIC_APP_ENV: production
                  NEXT_PUBLIC_APP_NAME: RentManager
                  NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: rentmanagerke2026@gmail.com
                  NEXT_TELEMETRY_DISABLED: "1"
                  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
                  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
              run: npx opennextjs-cloudflare build

            - name: Report the bundle size against the 64 MiB ceiling
              run: |
                  npx wrangler deploy --dry-run --outdir .wrangler-dry 2>&1 | tee dry.txt
                  echo "### Worker bundle" >> "$GITHUB_STEP_SUMMARY"
                  grep -E "Total Upload" dry.txt >> "$GITHUB_STEP_SUMMARY" || true
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx wrangler deploy
